<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LayerAI - حوّل فكرتك لتصميم بطبقات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:#0f1220;color:#fff}
.wrap{max-width:720px;margin:0 auto;padding:18px}
h1{margin:8px 0 6px;font-size:24px} p{opacity:.8}
textarea{width:100%;min-height:90px;border-radius:12px;border:0;padding:12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
select,input[type=file]{flex:1;min-width:140px;border-radius:10px;border:0;padding:10px;font-size:14px;background:#fff;color:#111}
button{width:100%;padding:14px;border-radius:12px;border:0;background:#ffb703;color:#111;font-weight:700;font-size:18px;cursor:pointer}
#msg{margin:10px 0;min-height:22px;font-size:14px}
#msg.err{color:#ff6b6b}#msg.ok{color:#51cf66}
a.dl{display:block;text-align:center;margin-top:12px;padding:12px;background:#2a5298;color:#fff;border-radius:10px;text-decoration:none}
small{opacity:.6}
</style>
</head>
<body>
<div class="wrap">
<h1>LayerAI</h1>
<p>كتب فكرتك بالعربية، واختار المقاس والأسلوب، وحمّل PSD بطبقات حقيقية.</p>
<textarea id="prompt" placeholder="مثال: حذاء رياضي أبيض عصري"></textarea>
<div class="row">
<select id="format">
<option value="thumbnail">صورة مصغرة 1280×720</option>
<option value="square">مربع 1080×1080</option>
<option value="portrait">عمودي 1080×1350</option>
<option value="story">ستوري 1080×1920</option>
<option value="banner">بانر 1920×600</option>
</select>
<select id="style">
<option value="">أسلوب تلقائي</option>
<option value="photo">فوتوغرافي</option>
<option value="painting">لوحة تشكيلية</option>
<option value="cartoon">كرتون</option>
<option value="cinematic">سينمائي</option>
<option value="digital">رقمي / خيالي</option>
<option value="educational">تربوي</option>
</select>
</div>
<div class="row">
<input type="file" id="image" accept="image/*"/>
</div>
<button id="go">توليد التصميم</button>
<div id="msg"></div>
<div id="dl"></div>
<small>الصورة المرجعية اختيارية. النص العربي كيترسم بالمتصفح باش يبان مزيان.</small>
</div>
<script src="config.js"></script>
<script src="psd.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
