<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerAI</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --text:#f2f4ff; --muted:#9aa3c7; --accent:#ffb703; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:8px 0 4px; font-size:28px; }
  p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin-bottom:8px; }
  textarea { width:100%; min-height:100px; border:1px solid #2c3354; border-radius:12px;
             background:#11152a; color:var(--text); padding:12px; font-size:16px; resize:vertical; }
  .drop { border:2px dashed #3a4270; border-radius:12px; padding:18px; text-align:center;
          color:var(--muted); cursor:pointer; }
  .drop img { max-width:100%; max-height:200px; border-radius:8px; display:block; margin:0 auto 8px; }
  input[type=file] { display:none; }
  button { width:100%; padding:14px; border:0; border-radius:12px; font-size:17px; font-weight:700;
           background:var(--accent); color:#1b1b1b; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .link { background:none; color:var(--muted); font-weight:400; font-size:14px; padding:8px; width:auto; }
  .msg { margin-top:12px; line-height:1.6; }
  .err { color:var(--err); }
  .hint { color:var(--muted); font-size:14px; }
  a.dl { display:block; text-align:center; margin-top:12px; padding:14px; border-radius:12px;
         background:#2ecc71; color:#0c2a17; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>LayerAI</h1>
  <p class="sub">حوّل أي فكرة أو تصميم إلى ملف PSD بطبقات مستقلة. استعمل برومت، أو صورة، أو الاثنين معاً.</p>

  <div class="card">
    <label for="prompt">البرومت (اختياري)</label>
    <textarea id="prompt" placeholder="مثال: غلاف يوتيوب عن الطبخ بألوان دافئة"></textarea>
  </div>

  <div class="card">
    <label>الصورة (اختياري)</label>
    <div class="drop" id="drop">
      <div id="dropText">اضغط لاختيار صورة</div>
    </div>
    <input type="file" id="file" accept="image/*">
    <button class="link" id="clear" type="button" hidden>إزالة الصورة</button>
  </div>

  <button id="go" type="button">توليد ملف PSD</button>
  <div class="msg" id="msg"></div>
  <p class="hint">الأنماط المتاحة: برومت فقط، صورة فقط، أو صورة مع برومت لتعديلها.</p>
</main>

<script>
  // Backend address. Empty = same origin (when served by the FastAPI app).
  // When hosting this page separately (e.g. Cloudflare Pages), put the backend URL here.
  const API_URL = "";

  const $ = (id) => document.getElementById(id);
  const fileInput = $("file"), drop = $("drop"), dropText = $("dropText");
  let blobUrl = null;

  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    dropText.replaceChildren(img, document.createTextNode(f.name));
    $("clear").hidden = false;
  });
  $("clear").addEventListener("click", () => {
    fileInput.value = "";
    dropText.textContent = "اضغط لاختيار صورة";
    $("clear").hidden = true;
  });

  function show(html, isErr) {
    const el = $("msg");
    el.className = "msg" + (isErr ? " err" : "");
    el.replaceChildren();
    if (typeof html === "string") el.textContent = html;
    else el.appendChild(html);
  }

  $("go").addEventListener("click", async () => {
    const prompt = $("prompt").value.trim();
    const file = fileInput.files[0];
    if (!prompt && !file) { show("اكتب برومت أو اختر صورة (أو الاثنين).", true); return; }

    const fd = new FormData();
    if (prompt) fd.append("prompt", prompt);
    if (file) fd.append("image", file);

    $("go").disabled = true;
    show("جاري التوليد... قد يستغرق دقيقة.");
    try {
      const res = await fetch(API_URL + "/generate", { method: "POST", body: fd });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).detail; } catch (_) {}
        throw new Error(detail || ("خطأ " + res.status));
      }
      const blob = await res.blob();
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.className = "dl"; a.href = blobUrl; a.download = "design.psd";
      a.textContent = "تحميل design.psd";
      show(a);
    } catch (e) {
      show("وقع خطأ: " + e.message, true);
    } finally {
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
